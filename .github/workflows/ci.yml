name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only reads the repo (checkout) and
# never pushes, comments, or otherwise writes back to it.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, format check, type-check, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python (from backend/.python-version)
        run: uv python install

      # --locked: fail instead of silently updating uv.lock. If dependencies
      # drift from the committed lock file, that's a bug in the PR, not
      # something CI should paper over.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Type-check (mypy)
        run: uv run mypy .

      - name: Test (pytest, with coverage)
        run: uv run pytest

  frontend:
    name: Frontend — lint, format check, type-check, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`): fail instead of silently updating
      # package-lock.json, mirroring the `uv sync --locked` policy above.
      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

      # The production build catches what tsc alone cannot: failed
      # prerendering, bad route config, and server/client boundary errors.
      - name: Build (next)
        run: npm run build
