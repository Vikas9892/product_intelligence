repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Docker Compose overlays may use the spec's `!reset` tag to drop a
        # value inherited from a base file. It is valid Compose YAML — and
        # `docker compose config` parses it — but it is a custom tag, and this
        # hook's generic parser fails with "could not determine a constructor
        # for the tag". Excluding the one file that needs it keeps the check on
        # for every other YAML in the repo, including the other compose files.
        exclude: ^deploy/oracle/docker-compose\.oracle\.yml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^backend/

  # A local hook (not the mirrors-mypy repo) runs mypy through the
  # project's own `uv` environment instead of an isolated pre-commit venv.
  # mypy needs `app`'s real installed location (an editable install of the
  # backend package) plus every runtime/dev dependency (fastapi, pytest,
  # httpx, ...) to resolve imports correctly — mirroring that in
  # `additional_dependencies` by hand drifts out of sync with
  # `pyproject.toml` over time (exactly what happened here: it was missing
  # `fastapi` from the moment Milestone 4 introduced it). `--directory
  # backend` runs mypy with the same working directory `make typecheck`/CI
  # use, which `mypy_path = "."` in `backend/pyproject.toml` assumes.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

default_language_version:
  python: python3.12
