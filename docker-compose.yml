# Application stack for the Multi-Modal Product Intelligence Engine.
#
#   docker compose up -d          # start everything
#   docker compose ps             # health of each service
#   docker compose down           # stop (data is preserved in named volumes)
#
# Defaults match backend/.env.example except where container networking
# requires otherwise: inside Compose, "localhost" means the container itself,
# so the Redis and Qdrant URLs are overridden to their service DNS names
# below. Everything else still falls back to the same built-in defaults, so
# no .env file is required to bring the stack up.

name: product-intelligence

# ---------------------------------------------------------------------------
# Shared log configuration
# ---------------------------------------------------------------------------
# Every service logs to stdout/stderr, which Docker captures. Without a size
# limit those files grow without bound -- and this stack is chatty: the worker
# logs a line per pipeline stage per job. Rotation caps total log usage at
# 30 MB per container instead of eventually filling the VM's disk.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ---------------------------------------------------------------------------
# Shared backend definition
# ---------------------------------------------------------------------------
# `api` and `worker` are the same image in two runtime roles, differing only
# in their command. Anchoring the common part means the image is built once
# and the two roles cannot drift apart in their configuration -- which
# matters, because they communicate through a shared filesystem and must
# agree on it exactly.
x-backend: &backend
  <<: *logging
  networks: [app]
  build:
    context: ./backend
  # Naming the image explicitly (rather than letting Compose derive
  # `product-intelligence-api`) means both services resolve to one build and
  # one artifact. This is the image Stage 10+ pushes to ECR to run as two
  # separate ECS services.
  image: product-intelligence-backend:latest
  environment: &backend-environment
    # Service DNS, not localhost -- the single most important difference
    # between running on the host and running in Compose.
    ASYNC_PIPELINE__REDIS_URL: redis://redis:6379/0
    VECTOR_STORE__URL: http://qdrant:6333
  env_file:
    # Optional: absent on a fresh clone, and the stack still starts. This is
    # where an operator puts real values (SECURITY__SECRET_KEY, enterprise
    # settings) without any of it being committed or baked into the image.
    - path: ./backend/.env
      required: false
  volumes:
    # Shared, and necessarily so. The API writes the uploaded file to disk and
    # enqueues a job carrying its *path* (ProductImage.original_path); the
    # worker then opens that path via ImageProcessingService. If these two
    # containers did not share this volume, every job would fail on a missing
    # file. Persisting it also keeps uploaded images across restarts.
    - app_storage:/app/storage
    # HF_HOME. CLIP (~600 MB) and BGE (~130 MB) download on first use; a named
    # volume means that happens once for the whole stack rather than once per
    # container per restart.
    - model_cache:/models
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_healthy
  restart: unless-stopped

services:
  frontend:
    <<: *logging
    networks: [app]
    build:
      context: ./frontend
    image: product-intelligence-frontend:latest
    container_name: pi-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # Substituted into the build output at container start by
      # frontend/docker-entrypoint.sh -- Next bakes rewrite destinations at
      # build time, so this cannot be a plain runtime lookup. `api` is Compose
      # service DNS; "localhost" here would mean the frontend container itself.
      BACKEND_ORIGIN: http://api:8000
    depends_on:
      api:
        # Waits for the API's real health check rather than merely for the
        # container to exist, so the first page load cannot race a backend
        # that is still importing torch.
        condition: service_healthy
    # Inherits the image's HEALTHCHECK, which probes this server's own `/`
    # and deliberately not the proxied /health -- see frontend/Dockerfile.

  api:
    <<: *backend
    container_name: pi-api
    ports:
      - "${API_PORT:-8000}:8000"
    # Inherits the image's default CMD (uvicorn) and its HEALTHCHECK.

  worker:
    <<: *backend
    container_name: pi-worker
    # The one line that separates the two roles. This is the process the
    # architecture diagram draws separately from the API: `uvicorn` never runs
    # WorkerManager itself, so nothing here duplicates work the API is doing.
    command: ["python", "scripts/run_workers.py"]
    # Must be disabled explicitly, not merely omitted: HEALTHCHECK is baked
    # into the shared image, so without this the worker inherits the API's
    # probe against :8000 -- a port it deliberately never opens -- and Docker
    # reports a perfectly functional worker as `unhealthy` forever.
    #
    # The worker serves no traffic and exposes no socket, so there is nothing
    # meaningful to probe. Its real liveness signal is that it keeps consuming
    # from the queue, and `restart: unless-stopped` covers a hard crash.
    # Adding an HTTP port purely to satisfy a health check would mean adding a
    # server the application does not have.
    healthcheck:
      disable: true

  qdrant:
    # Vector store for the image (512-d CLIP) and text (384-d BGE) collections.
    # Both are auto-created with cosine distance on first use by the backend.
    # Pinned to the 1.18 line to match the pinned qdrant-client 1.18.0.
    image: qdrant/qdrant:v1.18.1
    container_name: pi-qdrant
    restart: unless-stopped
    <<: *logging
    networks: [app]
    ports:
      # 6333 = REST (VECTOR_STORE__URL points here). 6334 = gRPC, exposed so
      # the client can be switched to it without editing this file.
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships no curl/wget, so probe the REST port over bash's
      # /dev/tcp rather than making an HTTP request.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    # Not just a queue: Redis is this platform's primary datastore. It holds
    # the job queue, product/job state, the recommendation cache, analytics
    # daily buckets, and enterprise tenant data (there is no relational
    # database — see backend/README.md). Persistence is therefore required,
    # not optional, which is why AOF is enabled below.
    image: redis:8.2-alpine
    container_name: pi-redis
    restart: unless-stopped
    <<: *logging
    networks: [app]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
# One explicit user-defined bridge rather than the implicit `default`. Being
# named in the file makes the topology reviewable, and a user-defined bridge is
# what provides the embedded DNS that lets `redis`, `qdrant` and `api` resolve
# as hostnames in the first place. Service-to-service traffic (frontend -> api,
# api/worker -> redis/qdrant) never leaves it; only the ports published below
# are reachable from the host.
networks:
  app:
    driver: bridge

volumes:
  qdrant_storage:
  redis_data:
  # Uploaded + processed images, shared by api and worker (see x-backend).
  app_storage:
  # Hugging Face cache (HF_HOME=/models): CLIP and BGE weights.
  model_cache:
