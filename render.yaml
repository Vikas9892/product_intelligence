# Render Blueprint — backend (API + worker) and its Key Value store.
#
# The frontend is NOT here: it deploys to Vercel, which proxies /api/v1/* to
# this service server-side (frontend/next.config.ts). See docs/DEPLOY.md.
#
# Qdrant is NOT here either. It holds the product catalog (products live as
# Qdrant payloads — there is no SQL database in this project), so it must
# outlive any single deploy. It runs on Qdrant Cloud; you supply its URL and
# API key below.
#
# One service runs BOTH the API and the worker pool. That is not a
# simplification — it is forced by the upload contract. The API writes an
# uploaded image to storage.upload_dir, the worker reads that same path back,
# and the API serves it later. A Render disk is reachable by exactly one
# service and cannot be mounted into a second, so splitting the roles would
# hand the worker an empty directory. backend/scripts/start_all.py documents
# the full trade.

services:
  - name: pi-backend
    type: web
    runtime: docker
    # Matched to the Qdrant Cloud cluster's region (eu-west-2 / London), NOT to
    # the operator's own location. One request drives several Qdrant round
    # trips — image search, text search, hybrid fusion, duplicate candidate
    # retrieval — so backend-to-Qdrant latency is multiplied in a way the
    # single browser-to-backend hop is not. Co-locating those two wins even
    # though it moves the API further from the user.
    #
    # If the Qdrant cluster is ever recreated in Asia-Pacific, change this back
    # to `singapore` and keep the pair together.
    #
    # Changing this after creation requires recreating the service and its
    # disk, so it is worth getting right the first time.
    region: frankfurt
    # Standard = 2 GB RAM. NOT negotiable downward: this image loads PyTorch
    # plus CLIP (~600 MB), BGE (~130 MB) and a cross-encoder, and it loads them
    # twice — once in the API process, once in the worker process. Render's
    # free and starter instances are 512 MB and will OOM on boot.
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Overrides the image's CMD (uvicorn alone) to run both roles. The image's
    # tini ENTRYPOINT still wraps this, so SIGTERM forwarding survives.
    dockerCommand: python scripts/start_all.py
    # /health is liveness only and deliberately never touches Redis or Qdrant
    # (backend/app/api/health.py), so a dependency blip cannot make Render
    # kill an otherwise healthy instance.
    healthCheckPath: /health

    disk:
      name: pi-storage
      # Must cover storage.upload_dir and storage.processed_dir, which
      # backend/app/core/paths.py resolves under <backend>/storage — /app/storage
      # in the image.
      mountPath: /app/storage
      sizeGB: 10

    envVars:
      # --- Environment ------------------------------------------------------
      # `staging`, deliberately not `production` — the same choice, for the
      # same reason, that docker-compose.prod.yml documents at length:
      # Settings._validate_production_safety refuses to boot in `production`
      # unless database.url is non-SQLite, but this platform has no relational
      # database at all (no SQLAlchemy anywhere; settings.database is
      # referenced only in a docstring). Selecting `production` would mean
      # inventing a Postgres URL that nothing ever connects to purely to
      # satisfy a validator. Everything that validator protects is set
      # explicitly below regardless.
      - key: APPLICATION__ENVIRONMENT
        value: staging
      - key: APPLICATION__DEBUG
        value: "false"
      - key: LOGGING__LEVEL
        value: INFO

      # TrustedHostMiddleware is the OUTERMOST middleware (app/application.py),
      # so a Host header not in this list is rejected before reaching any
      # route. It must contain this service's own hostname or every request —
      # including Render's health check — fails with 400.
      # A JSON array literal; sync: false so Render prompts you for it, since
      # the hostname is not known until the service exists.
      #   e.g. ["pi-backend.onrender.com"]
      - key: APPLICATION__TRUSTED_HOSTS
        sync: false

      # CORS stays unset/empty on purpose. The browser only ever talks to the
      # Vercel origin, which proxies to this service server-side, so requests
      # arriving here are never cross-origin.

      # --- Secrets ----------------------------------------------------------
      # Generated by Render and never present in the repo.
      - key: SECURITY__SECRET_KEY
        generateValue: true

      # --- Qdrant (product catalog) ----------------------------------------
      # From your Qdrant Cloud cluster. The URL includes the port, e.g.
      # https://xxxxxxxx.us-east.aws.cloud.qdrant.io:6333
      - key: VECTOR_STORE__URL
        sync: false
      - key: VECTOR_STORE__API_KEY
        sync: false

      # --- Redis (queue, analytics, enterprise, recommendation cache) -------
      - key: ASYNC_PIPELINE__REDIS_URL
        fromService:
          name: pi-keyvalue
          type: keyvalue
          property: connectionString

      # Two model sets share one CPU here. The default of 4 concurrent worker
      # loops oversubscribes it badly — and all four loading models at once is
      # what makes redis-py's async read timeout fire spuriously on a cold
      # start, since the blocked event loop cannot service the reply in time.
      - key: ASYNC_PIPELINE__WORKER_CONCURRENCY
        value: "2"

      # --- Storage ----------------------------------------------------------
      # Explicit absolute paths onto the mounted disk. These match the image
      # defaults, but naming them means a future change to the mountPath above
      # cannot silently leave uploads writing to the ephemeral layer — where
      # they would survive just long enough to look like they worked.
      - key: STORAGE__UPLOAD_DIR
        value: /app/storage/uploads
      - key: STORAGE__PROCESSED_DIR
        value: /app/storage/processed

      # Hugging Face cache, moved off the image default (/models, ephemeral)
      # onto the disk. CLIP + BGE are ~730 MB and download on first use; left
      # ephemeral they re-download on every deploy and restart, adding minutes
      # to each cold start. See the permissions note in docs/DEPLOY.md — this
      # is the first thing to check if the service fails to boot.
      - key: HF_HOME
        value: /app/storage/hf-cache

  - name: pi-keyvalue
    type: keyvalue
    # Must match pi-backend's region — a Key Value instance is only reachable
    # over the private network from services in the same region.
    region: frankfurt
    # Free tier is 25 MB and — critically — does not persist: its data is
    # in-memory only and is lost on every restart and upgrade. This store
    # holds the job queue, analytics counters, enterprise records and the
    # recommendation cache, so a wipe loses queued work and all reported
    # history. Starter is the smallest plan that survives a restart.
    plan: starter
    # noeviction, NOT an LRU policy. Under memory pressure an LRU policy would
    # silently evict queued jobs and analytics counters — uploads would vanish
    # mid-pipeline with no error anywhere, which presents exactly like the
    # "stuck at Queued forever" symptom that means a dead worker. Refusing
    # writes is loud; losing jobs is not.
    maxmemoryPolicy: noeviction
    ipAllowList: []  # empty = private network only; nothing external connects
